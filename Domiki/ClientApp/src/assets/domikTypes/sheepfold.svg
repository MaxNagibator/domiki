<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="crispEdges" data-size="128" data-level="1" data-working="false" data-active="true" data-state="idle" data-motion="on" role="img" aria-labelledby="sheepfold-title sheepfold-desc" focusable="false"><title id="sheepfold-title">Овчарня</title><desc id="sheepfold-desc">Овчарня с узнаваемым хлевом, оградой и отдельными овцами; пять уровней добавляют кормушку, знак, навес и золотую отделку.</desc><style>
